server {
    listen 80;
    listen [::]:80;
    server_name tickets.local;

    # HTTPS Redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tickets.local;
    root /var/www/tickets/public;
    index index.php;
    charset utf-8;

    # SSL Certificates
    ssl_certificate /etc/nginx/ssl/tickets.local.pem;
    ssl_certificate_key /etc/nginx/ssl/tickets.local-key.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Laravel API routes - Higher priority
    location ~ ^/(api|oauth|broadcasting)/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static files from Angular build
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpe?g|gif|svg|webp)$ {
        root /var/www/sysout/tickets/public/dist/browser;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PHP-FPM processing
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Angular SPA - catch all other routes
    location / {
        try_files $uri $uri/ @angular;
    }

    location @angular {
        root /var/www/tickets/public/dist/browser;
        try_files /index.html =404;
    }

    # Security - hide dot files
    location ~ /\. {
        deny all;
    }
}